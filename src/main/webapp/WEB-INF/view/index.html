	<script type="text/javascript">
	  $(function() {
		  // 替换为更高效的预加载方式
		  // $("img").lazyload({ threshold :180});
		  
		  // 确保侧边栏固定
		  fixSidebar();
		  
		  // 初始化滚动处理
		  initScrollHandling();
	  });
	  
	  // 固定侧边栏
	  function fixSidebar() {
	      $('.sidebar-menu').addClass('fixed');
	      
	      // 处理窗口大小变化
	      $(window).on('resize', function() {
	          adjustSidebarHeight();
	          adjustContentLayout();
	      });
	      
	      // 初始调整侧边栏高度和内容布局
	      adjustSidebarHeight();
	      adjustContentLayout();
	  }
	  
	  // 调整侧边栏高度
	  function adjustSidebarHeight() {
	      var windowHeight = $(window).height();
	      $('.sidebar-menu-inner').css('height', windowHeight + 'px');
	  }
	  
	  // 调整内容区域布局
	  function adjustContentLayout() {
	      var sidebarWidth = $('.sidebar-menu').hasClass('collapsed') ? 80 : 280;
	      $('.main-content').css({
	          'margin-left': sidebarWidth + 'px',
	          'width': 'calc(100% - ' + sidebarWidth + 'px)'
	      });
	  }
	  
	  // 初始化滚动处理
	  function initScrollHandling() {
	      // 检测侧边栏折叠状态变化
	      $(document).on('click', '[data-toggle="sidebar"]', function() {
	          setTimeout(function() {
	              adjustContentLayout();
	          }, 300);
	      });
	      
	      // 确保内容区域滚动时菜单跟踪
	      $('.main-content').on('scroll', function() {
	          updateScrollIndicatorState();
	      });
	  }
	  
	  // 更新滚动指示器状态
	  function updateScrollIndicatorState() {
	      var scrollPosition = $('.main-content').scrollTop();
	      var sectionPositions = [];
	      
	      // 获取所有分类的位置
	      $('h4.text-gray').each(function() {
	          var id = $(this).find('i').attr('id');
	          if (id) {
	              sectionPositions.push({
	                  id: id,
	                  top: $(this).offset().top - $('.main-content').offset().top + scrollPosition - 80
	              });
	          }
	      });
	      
	      // 按位置排序
	      sectionPositions.sort(function(a, b) {
	          return a.top - b.top;
	      });
	      
	      // 找到当前位置对应的分类
	      var currentSection = null;
	      for (var i = 0; i < sectionPositions.length; i++) {
	          if (scrollPosition >= sectionPositions[i].top) {
	              currentSection = sectionPositions[i].id;
	          } else {
	              break;
	          }
	      }
	      
	      // 更新指示器状态和菜单高亮
	      if (currentSection) {
	          // 更新指示器
	          $('.scroll-indicator-dot').removeClass('active');
	          $('.scroll-indicator-dot[data-target="#' + currentSection + '"]').addClass('active');
	          
	          // 更新菜单高亮
	          highlightMenuItem(currentSection);
	      }
	  }
	  
		$(document).ready(
				function() {
					// 确保侧边栏固定
					fixSidebar();
					
					$(document).on('click', '.has-sub', function() {
						var _this = $(this)
						if (!$(this).hasClass('expanded')) {
							setTimeout(function() {
								_this.find('ul').attr("style", "")
							}, 300);

						} else {
							$('.has-sub ul').each(function(id, ele) {
								var _that = $(this)
								if (_this.find('ul')[0] != ele) {
									setTimeout(function() {
										_that.attr("style", "")
									}, 300);
								}
							})
						}
					})
					$('.user-info-menu .hidden-sm').click(function() {
						if ($('.sidebar-menu').hasClass('collapsed')) {
							$('.has-sub.expanded > ul').attr("style", "")
						} else {
							$('.has-sub.expanded > ul').show()
						}
					})
					$("#main-menu li ul li").click(function() {
						$(this).siblings('li').removeClass('active'); // 删除其他兄弟元素的样式
						$(this).addClass('active'); // 添加当前元素的样式
					});
					
					// 改进平滑滚动功能
					$("a.smooth").click(
							function(ev) {
								ev.preventDefault();

								// 移动端菜单处理
								if ($('.sidebar-menu').hasClass('mobile-is-visible')) {
									public_vars.$mainMenu.add(
											public_vars.$sidebarProfile)
											.toggleClass('mobile-is-visible');
									ps_destroy();
								}
								
								// 获取目标元素
								var target = $(this).attr("href");
								var $target = $(target);
								
								if ($target.length > 0) {
									// 计算滚动位置，使用main-content作为滚动容器
									var targetPosition = $target.offset().top - $('.main-content').offset().top + $('.main-content').scrollTop() - 50;
									
									// 执行平滑滚动
									$(".main-content").animate(
											{
												scrollTop: targetPosition
											}, {
												duration: 500,
												easing: "swing",
												complete: function() {
													// 滚动完成后高亮菜单
													highlightMenuItem(target.substring(1));
												}
											});
								}
							});
					
					// 初始化滚动指示器
					generateScrollIndicator();
					
					return false;
				});

		// 高亮指定的菜单项
		function highlightMenuItem(sectionId) {
			$("#main-menu li").removeClass("active");
			var $menuItem = $('#main-menu a[href="#' + sectionId + '"]');
			
			if ($menuItem.length > 0) {
				// 如果在子菜单，展开父菜单
				var $parentLi = $menuItem.closest('ul').parent('li');
				if ($parentLi.length > 0) {
					$parentLi.addClass('expanded active');
				}
				
				$menuItem.parent('li').addClass('active');
				
				// 确保菜单项在视图内
				ensureMenuItemVisible($menuItem);
			}
		}
		
		// 确保菜单项可见
		function ensureMenuItemVisible($menuItem) {
			if ($menuItem.length === 0) return;
			
			var menuHeight = $('.sidebar-menu-inner').height();
			var itemTop = $menuItem.position().top;
			var itemHeight = $menuItem.outerHeight();
			var scrollTop = $('.sidebar-menu-inner').scrollTop();
			
			// 如果菜单项不在可见区域内，滚动到可见位置
			if (itemTop < 0 || itemTop + itemHeight > menuHeight) {
				$('.sidebar-menu-inner').animate({
					scrollTop: scrollTop + itemTop - menuHeight / 2 + itemHeight / 2
				}, 300);
			}
		}
		
		// 生成滚动指示器
		function generateScrollIndicator() {
			var $indicator = $('#scroll-indicator');
			var sections = $('h4.text-gray');
			
			// 清空滚动指示器
			$indicator.empty();
			
			// 为每个分类标题创建一个指示点
			sections.each(function(index) {
				var id = $(this).find('i').attr('id');
				if (id) {
					var $dot = $('<div class="scroll-indicator-dot" data-target="#' + id + '"></div>');
					$indicator.append($dot);
					
					// 点击指示点滚动到对应位置
					$dot.on('click', function() {
						var target = $(this).data('target');
						var $target = $(target);
						if ($target.length > 0) {
							var targetPosition = $target.offset().top - $('.main-content').offset().top + $('.main-content').scrollTop() - 50;
							$('.main-content').animate({
								scrollTop: targetPosition
							}, 500);
						}
					});
				}
			});
		}
	</script>
	
	<!-- 引入新的JS文件 -->
	<script src="${ctxPath}/static/js/scroll-tracker.js"></script>
	<script src="${ctxPath}/static/js/content-preloader.js"></script>

</body>
